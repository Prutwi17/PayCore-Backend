name: PayCore Backend CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Tests
        run: mvn clean verify -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Display test failure reports
        if: failure()
        run: |
          echo "=================================================="
          echo "DUMPING SUREFIRE TEST FAILURE REPORTS"
          echo "=================================================="
          for f in target/surefire-reports/*.txt; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
            fi
          done
