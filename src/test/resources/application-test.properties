# ===================================================================
# PayCore — Automated Test Suite Configuration
# ===================================================================

spring.application.name=paycore-backend-test

# Use In-Memory H2 Database for fast isolated testing
spring.datasource.url=jdbc:h2:mem:paycore_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Disable external Redis during test context load
spring.data.redis.repositories.enabled=false
paycore.redis.enabled=false
spring.data.redis.timeout=100ms
spring.data.redis.connect-timeout=100ms

# Disable Kafka in test profile
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
paycore.kafka.enabled=false

# Disable background schedulers during automated testing
paycore.scheduling.enabled=false
paycore.outbox.publisher.enabled=false
paycore.webhook.retry.enabled=false

# Allow local loopback testing for in-process HTTP servers
paycore.webhook.allow-local-loopback=true

# Actuator Health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Swagger paths
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging in test mode
logging.level.root=WARN
logging.level.com.paycore=INFO


# Email testing properties
paycore.email.provider=gmail
paycore.email.client-id=mock-google-client-id
paycore.email.client-secret=mock-google-client-secret
paycore.email.redirect-uri=http://localhost:8080/api/v1/auth/google/callback
paycore.email.refresh-token=mock-google-refresh-token
paycore.email.sender-email=omp27614@gmail.com
paycore.email.frontend-url=http://localhost:5173

paycore.auth.auto-verify-email=true
paycore.security.seed-test-admin=true
