# ===================================================================



# PayCore — Automated Test Suite Configuration



# ===================================================================



spring.application.name=paycore-backend-test







# Use In-Memory H2 Database for fast isolated testing



spring.datasource.url=jdbc:h2:mem:paycore_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL



spring.datasource.driver-class-name=org.h2.Driver



spring.datasource.username=sa



spring.datasource.password=







# Hibernate Configuration for H2



spring.jpa.database-platform=org.hibernate.dialect.H2Dialect



spring.jpa.hibernate.ddl-auto=create-drop



spring.jpa.open-in-view=false



spring.jpa.show-sql=false







# Disable external Redis during test context load



spring.data.redis.repositories.enabled=false

paycore.redis.enabled=false



spring.data.redis.timeout=100ms



spring.data.redis.connect-timeout=100ms







# Embedded Kafka / Mock configuration for test profile



spring.kafka.bootstrap-servers=localhost:9092



spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=false







# Actuator Health



management.endpoints.web.exposure.include=health



management.endpoint.health.show-details=always







# Swagger paths



springdoc.swagger-ui.enabled=false



springdoc.api-docs.enabled=false







# Logging in test mode



logging.level.root=WARN



logging.level.com.paycore=INFO



