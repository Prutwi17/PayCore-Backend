# ===================================================================
# PayCore — Production Environment Profile (prod)
# Activated via SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod
# ===================================================================

# Server Security & Information Hiding
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Database DDL Safety (Never allow auto-drop or auto-update in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimized for Production Load
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# Actuator Health Exposure (Never leak environment or configuration in prod)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Production Logging (Mask debug output, keep error and audit telemetry)
logging.level.root=INFO
logging.level.com.paycore=INFO
logging.level.com.paycore.audit=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Security Enforcements
paycore.auth.auto-verify-email=false
paycore.security.seed-test-admin=false

# Token Cleanup Job (Runs at 02:00 AM daily)
paycore.auth.token-cleanup.cron=0 0 2 * * ?
