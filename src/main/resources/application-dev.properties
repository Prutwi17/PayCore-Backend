# ===================================================================
# PayCore — Zero-Dependency Local Development Profile (dev)
# Activated via: --spring.profiles.active=dev
# Runs with embedded in-memory H2 (MySQL Mode) with no external Docker,
# MySQL, Redis, or Kafka installation required!
# ===================================================================

server.port=8080

# In-Memory Database with MySQL syntax compatibility
spring.datasource.url=jdbc:h2:mem:paycore_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable external Redis requirement (DistributedLockService falls back smoothly)
paycore.redis.enabled=false
spring.data.redis.repositories.enabled=false

# Disable external Kafka requirement (KafkaProducerService / TopicConfig skips)
paycore.kafka.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false

# Seed Administrator Accounts for immediate login
paycore.security.seed-test-admin=true
paycore.auth.auto-verify-email=true

# Actuator & OpenAPI
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Email Diagnostics
paycore.email.provider=gmail
paycore.email.sender-email=omp27614@gmail.com
paycore.email.frontend-url=http://localhost:5173

logging.level.root=INFO
logging.level.com.paycore=INFO
